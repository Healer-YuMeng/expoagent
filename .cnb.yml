.build_and_push_backend: &build_and_push_backend
  name: build-and-push-backend-image
  services:
    - docker
  imports:
    - https://cnb.cool/fenyuanSaki/key/-/blob/main/env.prod.yml
  env:
    SERVER_DOCKER_REGISTRY: youwei.tencentcloudcr.com
    SERVER_DOCKER_NAMESPACE: expoagent
    BACKEND_IMAGE_NAME: expoagent-backend
  stages:
    - name: docker-login-build-push
      jobs:
        - name: build and push backend image
          image: docker:24
          script:
            - test -n "$SERVER_DOCKER_REGISTRY"
            - test -n "$SERVER_DOCKER_NAMESPACE"
            - test -n "$SERVER_DOCKER_USERNAME"
            - test -n "$SERVER_DOCKER_PASSWORD"
            - echo "$SERVER_DOCKER_PASSWORD" | docker login "$SERVER_DOCKER_REGISTRY" -u "$SERVER_DOCKER_USERNAME" --password-stdin
            - DOCKER_BUILDKIT=1 docker build --progress=plain -f backend/Dockerfile -t "${SERVER_DOCKER_REGISTRY}/${SERVER_DOCKER_NAMESPACE}/${BACKEND_IMAGE_NAME}:${CNB_COMMIT_SHORT}" -t "${SERVER_DOCKER_REGISTRY}/${SERVER_DOCKER_NAMESPACE}/${BACKEND_IMAGE_NAME}:latest" .
            - docker push "${SERVER_DOCKER_REGISTRY}/${SERVER_DOCKER_NAMESPACE}/${BACKEND_IMAGE_NAME}:${CNB_COMMIT_SHORT}"
            - docker push "${SERVER_DOCKER_REGISTRY}/${SERVER_DOCKER_NAMESPACE}/${BACKEND_IMAGE_NAME}:latest"

.build_and_push_frontend: &build_and_push_frontend
  name: build-and-push-frontend-image
  services:
    - docker
  imports:
    - https://cnb.cool/fenyuanSaki/key/-/blob/main/env.prod.yml
  env:
    SERVER_DOCKER_REGISTRY: youwei.tencentcloudcr.com
    SERVER_DOCKER_NAMESPACE: expoagent
    FRONTEND_IMAGE_NAME: expoagent-frontend
  stages:
    - name: docker-login-build-push
      jobs:
        - name: build and push frontend image
          image: docker:24
          script:
            - test -n "$SERVER_DOCKER_REGISTRY"
            - test -n "$SERVER_DOCKER_NAMESPACE"
            - test -n "$SERVER_DOCKER_USERNAME"
            - test -n "$SERVER_DOCKER_PASSWORD"
            - echo "$SERVER_DOCKER_PASSWORD" | docker login "$SERVER_DOCKER_REGISTRY" -u "$SERVER_DOCKER_USERNAME" --password-stdin
            - DOCKER_BUILDKIT=1 docker build --progress=plain --build-arg tiao="${tiao:-8606/visitor}" -f frontend/Dockerfile -t "${SERVER_DOCKER_REGISTRY}/${SERVER_DOCKER_NAMESPACE}/${FRONTEND_IMAGE_NAME}:${CNB_COMMIT_SHORT}" -t "${SERVER_DOCKER_REGISTRY}/${SERVER_DOCKER_NAMESPACE}/${FRONTEND_IMAGE_NAME}:latest" .
            - docker push "${SERVER_DOCKER_REGISTRY}/${SERVER_DOCKER_NAMESPACE}/${FRONTEND_IMAGE_NAME}:${CNB_COMMIT_SHORT}"
            - docker push "${SERVER_DOCKER_REGISTRY}/${SERVER_DOCKER_NAMESPACE}/${FRONTEND_IMAGE_NAME}:latest"

main:
  push:
    - *build_and_push_backend
    - *build_and_push_frontend
