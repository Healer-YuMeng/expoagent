name: expoagent

services:
  postgres:
    image: postgres:16-alpine
    container_name: expoagent_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-general_agent_admissions}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5636}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-general_agent_admissions}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: expoagent_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6596}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: expoagent_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${RAG_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RAG_MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9613}:9000"
      - "${MINIO_CONSOLE_PORT:-9614}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    image: ${SERVER_DOCKER_REGISTRY:-youwei.tencentcloudcr.com}/${SERVER_DOCKER_NAMESPACE:-expoagent}/${BACKEND_IMAGE_NAME:-expoagent-backend}:${BACKEND_IMAGE_TAG:-latest}
    pull_policy: ${BACKEND_PULL_POLICY:-always}
    container_name: expoagent_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_CONTAINER_PORT:-9008}
      POSTGRES_SSL: "False"
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-general_agent_admissions}
      RAG_REDIS_URL: redis://redis:6379/0
      RAG_MINIO_ENDPOINT: minio:9000
      RAG_MINIO_SECURE: "False"
    volumes:
      - backend_logs:/app/backend/logs
      - backend_rag:/app/backend/rag/data
      - backend_static:/app/backend/app/static
    ports:
      - "${BACKEND_HOST_PORT:-9608}:${BACKEND_CONTAINER_PORT:-9008}"

  frontend:
    image: ${SERVER_DOCKER_REGISTRY:-youwei.tencentcloudcr.com}/${SERVER_DOCKER_NAMESPACE:-expoagent}/${FRONTEND_IMAGE_NAME:-expoagent-frontend}:${FRONTEND_IMAGE_TAG:-latest}
    pull_policy: ${FRONTEND_PULL_POLICY:-always}
    container_name: expoagent_frontend
    restart: always
    depends_on:
      - backend
    environment:
      API_UPSTREAM: http://backend:${BACKEND_CONTAINER_PORT:-9008}
    ports:
      - "${FRONTEND_HOST_PORT:-8606}:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_logs:
  backend_rag:
  backend_static:
